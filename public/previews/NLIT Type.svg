<text transform="matrix(1 0 0 1 39.9995 218.1284)"><tspan x="0" y="0" class="st11 st12">We chose to pair Gilroy and Quincy to reflect </tspan><tspan x="0" y="25.4" class="st11 st12">our dual identity. Gilroy provides the geometric </tspan><tspan x="0" y="50.9" class="st11 st12">structure needed for global clarity, while </tspan><tspan x="0" y="76.3" class="st11 st12">Quincy’s warm, rhythmic curves bring a </tspan><tspan x="0" y="101.7" class="st11 st12">human-centric feel to the narrative. The two </tspan><tspan x="0" y="127.1" class="st11 st12">fonts share a compatible x-height, ensuring </tspan><tspan x="0" y="152.6" class="st11 st12">a </tspan><tspan x="18.7" y="152.6" class="st11 st12">seamless layout that feels both professional </tspan><tspan x="0" y="178" class="st11 st12">and approachable.</tspan></text>
