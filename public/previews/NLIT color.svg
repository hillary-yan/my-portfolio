<text transform="matrix(1 0 0 1 39.9995 218.1284)" class="st4 st5">This palette combines Canadian Maple Red with </text>
<text transform="matrix(1 0 0 1 39.9995 243.5284)" class="st4 st5">Dubai Desert Sand to reflect both contexts. The </text>
<text transform="matrix(1 0 0 1 39.9995 269.0284)" class="st4 st5">strong red brings energy and visibility,</text>
<text transform="matrix(1 0 0 1 368.0995 269.0284)" class="st4 st5"> while the </text>
<text transform="matrix(1 0 0 1 39.9995 294.4284)" class="st4 st5">softer earth tones create balance and </text>
<text transform="matrix(1 0 0 1 39.9995 319.8284)" class="st4 st5">rhythm. Together, they form a system that </text>
<text transform="matrix(1 0 0 1 39.9995 345.2284)" class="st4 st5">feels professional, calm, and easy to work </text>
<text transform="matrix(1 0 0 1 39.9995 370.7284)" class="st4 st5">with across different brand applications.</text>
